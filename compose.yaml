name: jet-worker

x-python: &python
  build:
    context: .
    args:
      PYTHON_SERIES: ${PYTHON_VERSION:-3.13}
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
  image: jet-worker-dev:${PYTHON_VERSION:-3.13}
  init: true
  volumes:
    - .:/app
  environment: &environment
    NATS_URL: nats://nats:4222
    NATS_MONITOR_URL: http://nats:8222
    NATS_EXPECTED_NODES: ${NATS_EXPECTED_NODES:-1}
    NATS_REPLICAS: ${NATS_REPLICAS:-1}

x-nats: &nats
  image: nats:2.15.2-alpine
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
    interval: 2s
    timeout: 2s
    retries: 30
  stop_grace_period: 15s

services:
  nats:
    <<: *nats
    command:
      - --name=seed
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    volumes:
      - nats-data:/data

  tools:
    <<: *python
    profiles: [tools]

  tests:
    <<: *python
    profiles: [test]
    command: [sh, scripts/integration.sh]
    depends_on:
      nats:
        condition: service_healthy

  worker:
    <<: *python
    profiles: [dev]
    command: [sh, scripts/dev.sh]
    environment:
      <<: *environment
      WORKER_COMMAND: ${WORKER_COMMAND:-}
    depends_on:
      nats:
        condition: service_healthy

  editor:
    <<: *python
    profiles: [editor]
    command: [sleep, infinity]

volumes:
  nats-data:
