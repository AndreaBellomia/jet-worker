name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make check
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      - name: Store distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Store coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.python }}
          path: reports/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: NATS ${{ matrix.nodes }} node(s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nodes: [1, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sh scripts/run-integration.sh "$NODES"
        env:
          NODES: ${{ matrix.nodes }}

  security:
    name: CVE and secrets Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make security
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      - name: Store security reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-reports-${{ matrix.python }}
          path: reports/trivy-*.json
          if-no-files-found: warn
          retention-days: 7

  gates:
    name: Quality gates
    if: always()
    needs: [quality, integration, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$QUALITY" = success && test "$INTEGRATION" = success && test "$SECURITY" = success
